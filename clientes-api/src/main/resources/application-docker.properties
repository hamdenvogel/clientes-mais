application.name=Clientes
application.version=2.0.1
application.author=Hamden Vogel
application.env=Docker
spring.application.name=clientes-api

# Database (serviço "postgres" do docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/meusservicos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clientes}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=io.github.hvogel.clientes.config.CustomPostgreSQLDialect
spring.jpa.properties.hibernate.dialect=io.github.hvogel.clientes.config.CustomPostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=meusservicos
# Lab local: cria/atualiza schema a partir das entities (banco Docker vazio)
spring.jpa.hibernate.ddl-auto=update

security.oauth2.client.scope=password
security.jwt.signing-key=${SECURITY_JWT_SIGNING_KEY:cmFtb25lcw==}
security.jwt.expiracao=${SECURITY_JWT_EXPIRACAO:1200}
security.jwt.chave-assinatura=${SECURITY_JWT_CHAVE_ASSINATURA:YSBsZW1icmUgZSBicmFuY2EgZSBtdWl0byBib25pdGEgcGFyYSB1c2FyIGNvbW8gY2hhdmU=}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:*,http://127.0.0.1:*}

via-cep.url=http://viacep.com.br/ws/{cep}
via-cep.format=/json

google.recaptcha.key.site=${GOOGLE_RECAPTCHA_SITE:docker-placeholder}
google.recaptcha.key.secret=${GOOGLE_RECAPTCHA_SECRET:docker-placeholder}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

logging.level.root=INFO
logging.level.io.github.hvogel.clientes=INFO
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

app.registration.confirmation.expiration-hours=2
app.registration.frontend-confirm-url=${APP_REGISTRATION_FRONTEND_CONFIRM_URL:http://localhost:4200/#/confirmar-cadastro}
app.registration.token.hash-secret=${APP_REGISTRATION_TOKEN_SECRET:clientes-docker-secret}
app.registration.mail.enabled=false
app.registration.mail.from=noreply@clientes.local
app.registration.mail.from-name=Plataforma Clientes

app.features.legacy-image-enabled=false

# RabbitMQ (Compose: serviço rabbitmq)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:clientes}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:clientes}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
