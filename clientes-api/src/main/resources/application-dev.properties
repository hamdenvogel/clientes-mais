application.name=Clientes
application.version=2.0.1
application.author=Hamden Vogel
application.env=Desenvolvimento

# Database — valores via variáveis de ambiente (ver .env.example)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/meusservicos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=io.github.hvogel.clientes.config.CustomPostgreSQLDialect
spring.jpa.properties.hibernate.dialect=io.github.hvogel.clientes.config.CustomPostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=meusservicos

# Security — sem defaults secretos no repositório
security.oauth2.client.scope=password
security.jwt.signing-key=${SECURITY_JWT_SIGNING_KEY}
security.jwt.expiracao=${SECURITY_JWT_EXPIRACAO:1200}
security.jwt.chave-assinatura=${SECURITY_JWT_CHAVE_ASSINATURA}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:*,http://127.0.0.1:*}

# ViaCEP API
via-cep.url=http://viacep.com.br/ws/{cep}
via-cep.format=/json

# Google Recaptcha
google.recaptcha.key.site=${GOOGLE_RECAPTCHA_SITE:}
google.recaptcha.key.secret=${GOOGLE_RECAPTCHA_SECRET:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

# Logging
logging.level.root=WARN
logging.level.io.github.hvogel.clientes=DEBUG
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=false

# Registration confirmation flow
app.registration.confirmation.expiration-hours=2
app.registration.frontend-confirm-url=${APP_REGISTRATION_FRONTEND_CONFIRM_URL:http://localhost:4200/#/confirmar-cadastro}
app.registration.token.hash-secret=${APP_REGISTRATION_TOKEN_SECRET}
app.registration.mail.enabled=false
app.registration.mail.from=noreply@clientes.local
app.registration.mail.from-name=Plataforma Clientes

# Legacy image endpoint feature flag
app.features.legacy-image-enabled=false

# RabbitMQ (Docker Compose local)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:clientes}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
