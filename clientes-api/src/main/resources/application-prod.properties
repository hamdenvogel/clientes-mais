
#Google Recaptcha
google.recaptcha.key.site=6LfWbsEbAAAAAHULqvnjRg_V5oInPHdy6jeyP8ZR
google.recaptcha.key.secret=${RECAPTCHA_SECRET}
app.cors.allowed-origin-patterns=https://clientes-hvogel.herokuapp.com,https://clientes-hvogel-api.herokuapp.com,http://localhost:4200,http://127.0.0.1:4200

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Registration confirmation flow
app.registration.confirmation.expiration-hours=${APP_REGISTRATION_CONFIRMATION_EXP_HOURS:2}
app.registration.frontend-confirm-url=${APP_REGISTRATION_FRONTEND_CONFIRM_URL:https://clientes-hvogel.herokuapp.com/#/confirmar-cadastro}
app.registration.token.hash-secret=${APP_REGISTRATION_TOKEN_SECRET}
app.registration.mail.enabled=${APP_REGISTRATION_MAIL_ENABLED:true}
app.registration.mail.from=${APP_REGISTRATION_MAIL_FROM:noreply@clientes.local}
app.registration.mail.from-name=${APP_REGISTRATION_MAIL_FROM_NAME:Plataforma Clientes}

# Legacy image endpoint feature flag
app.features.legacy-image-enabled=${APP_FEATURES_LEGACY_IMAGE_ENABLED:false}
