# Produção — todos os segredos via variáveis de ambiente (nunca hardcoded)

google.recaptcha.key.site=${GOOGLE_RECAPTCHA_SITE}
google.recaptcha.key.secret=${GOOGLE_RECAPTCHA_SECRET}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.registration.confirmation.expiration-hours=${APP_REGISTRATION_CONFIRMATION_EXP_HOURS:2}
app.registration.frontend-confirm-url=${APP_REGISTRATION_FRONTEND_CONFIRM_URL}
app.registration.token.hash-secret=${APP_REGISTRATION_TOKEN_SECRET}
app.registration.mail.enabled=${APP_REGISTRATION_MAIL_ENABLED:true}
app.registration.mail.from=${APP_REGISTRATION_MAIL_FROM:noreply@clientes.local}
app.registration.mail.from-name=${APP_REGISTRATION_MAIL_FROM_NAME:Plataforma Clientes}

app.features.legacy-image-enabled=${APP_FEATURES_LEGACY_IMAGE_ENABLED:false}

security.jwt.signing-key=${SECURITY_JWT_SIGNING_KEY}
security.jwt.chave-assinatura=${SECURITY_JWT_CHAVE_ASSINATURA}
security.jwt.expiracao=${SECURITY_JWT_EXPIRACAO:1200}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
