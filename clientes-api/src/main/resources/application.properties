spring.profiles.active=dev
spring.jpa.database-platform=io.github.hvogel.clientes.config.CustomPostgreSQLDialect
spring.jpa.properties.hibernate.dialect=io.github.hvogel.clientes.config.CustomPostgreSQLDialect

# Actuator / Prometheus (exposto; Security libera health/info/prometheus)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name:clientes-api}
