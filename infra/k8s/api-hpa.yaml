# HPA opcional — descomente/aplique quando quiser testar autoscaling no lab
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clientes-api
  namespace: clientes-mais
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clientes-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
